[package]
name = "babry"
version = "0.1.5"
edition = "2024"

[dependencies]
libc = "0.2"
libloading = "0.8"
memmap2 = "0.9"
png = "0.18"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
svgtypes = "0.16"
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
