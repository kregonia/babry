[package]
name = "babry"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
image = "0.25"
imageproc = "0.25"
slint = { version = "1.17", features = ["unstable-fontique-010"] }
tempfile = "3"
serde_json = "1"
smithay-client-toolkit = "0.20"

[build-dependencies]
slint-build = "1.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
