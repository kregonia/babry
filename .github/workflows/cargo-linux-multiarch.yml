name: cargo-linux-multiarch

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 两种架构分别原生构建，避免交叉编译误用宿主机的系统库。
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify release binary
        run: |
          file target/${{ matrix.target }}/release/babry
          target/${{ matrix.target }}/release/babry --help

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/babry
          if-no-files-found: error
