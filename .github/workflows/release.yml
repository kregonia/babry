name: release

# 打版本标签时构建二进制并发布 GitHub Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libxkbcommon-dev libwayland-dev

      - name: Test and build release binary
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release

      - name: Verify release binary
        run: |
          file target/release/babry
          target/release/babry --help

      - name: Stage release asset
        run: |
          mkdir -p dist
          cp target/release/babry "dist/babry-amd64-linux-${GITHUB_REF_NAME}"
          (cd dist && sha256sum "babry-amd64-linux-${GITHUB_REF_NAME}" > SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "babry ${GITHUB_REF_NAME}" \
              --verify-tag \
              "${notes_args[@]}"
          fi